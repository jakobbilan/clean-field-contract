<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Key-message cards</title>
<!-- Source for the key-message images in press/key-messages. Open with ?n=1..6&f=wide or ?n=1..6&f=tall;
     tools/press.py renders every card to PNG. Facts and sources match the brief (see data/claims-register.csv). -->
<style>
@font-face { font-family: "STIX Two Text"; src: url("../../fonts/stix-two-text-latin-wght-normal.woff2") format("woff2"); font-weight: 400 700; }
@font-face { font-family: "STIX Two Text"; src: url("../../fonts/stix-two-text-latin-ext-wght-normal.woff2") format("woff2"); font-weight: 400 700; unicode-range: U+20B9; }
@font-face { font-family: "Fira Sans"; src: url("../../fonts/fira-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Fira Sans"; src: url("../../fonts/fira-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Fira Sans"; src: url("../../fonts/fira-sans-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Fira Sans"; src: url("../../fonts/fira-sans-latin-ext-400-normal.woff2") format("woff2"); font-weight: 400 500; unicode-range: U+20B9; }
@font-face { font-family: "Fira Sans"; src: url("../../fonts/fira-sans-latin-ext-600-normal.woff2") format("woff2"); font-weight: 600; unicode-range: U+20B9; }
:root { --ink: #1d2327; --ink-2: #48535a; --ink-3: #5b666c; --rule: #d4dada; --ember: #b8371a; --ember-soft: rgba(184, 55, 26, 0.13);
  --field: #2c6a4d; --centre: #33557a; --delhi: #946a12; --land: #e9eceb; --land-line: #9aa5a5; }
* { box-sizing: border-box; margin: 0; }
body { background: #8a9396; }
#card { position: relative; background: #ffffff; color: var(--ink); overflow: hidden; }
#card.wide { width: 1600px; height: 900px; padding: 84px 92px 76px; display: grid; grid-template-columns: 720px 1fr; column-gap: 72px; grid-template-rows: 1fr auto; }
#card.tall { width: 1080px; height: 1350px; padding: 80px 80px 70px; display: grid; grid-template-rows: auto 1fr auto; }
.statement { font-family: "STIX Two Text", serif; font-weight: 600; letter-spacing: -0.005em; color: var(--ink); }
.wide .statement { font-size: 60px; line-height: 1.12; }
.tall .statement { font-size: 58px; line-height: 1.12; }
.support { font-family: "Fira Sans", sans-serif; color: var(--ink-2); }
.wide .support { font-size: 27px; line-height: 1.45; margin-top: 34px; }
.tall .support { font-size: 29px; line-height: 1.45; margin-top: 30px; }
.visual { display: flex; align-items: center; justify-content: center; }
.wide .visual { grid-column: 2; grid-row: 1; }
.tall .visual { padding: 28px 0 8px; }
.foot { font-family: "Fira Sans", sans-serif; border-top: 1px solid var(--rule); padding-top: 22px; }
.wide .foot { grid-column: 1 / -1; grid-row: 2; display: flex; justify-content: space-between; gap: 40px; font-size: 21px; }
.tall .foot { font-size: 21px; }
.foot .src { color: var(--ink-3); }
.foot .brief { color: var(--ink-2); white-space: nowrap; }
.tall .foot .brief { margin-top: 8px; }
svg text { font-family: "Fira Sans", sans-serif; fill: var(--ink-2); }
svg .strong { fill: var(--ink); font-weight: 600; }
svg .ember { fill: var(--ember); font-weight: 600; }
svg .white { fill: #ffffff; font-weight: 600; }
</style>
</head>
<body>
<div id="card"><div class="text"><p class="statement"></p><p class="support"></p></div><div class="visual"></div><div class="foot"><p class="src"></p><p class="brief">The Clean Field Contract, policy brief, November 2026. jakobbilan.github.io/clean-field-contract</p></div></div>
<script src="../../vendor/d3-7.9.0.min.js"></script>
<script src="../../vendor/topojson-client-3.1.0.min.js"></script>
<script src="../../js/geo.js"></script>
<script src="../../js/india.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), n = +(q.get('n') || 1), wide = (q.get('f') || 'wide') === 'wide';
  var card = document.getElementById('card');
  card.className = wide ? 'wide' : 'tall';
  var W = wide ? 640 : 920, H = wide ? 560 : 560, C = Math.cos(30 * Math.PI / 180);
  var CARDS = {
    1: { s: 'Crop fires in Punjab cause 64% of India’s exposure to crop-fire smoke.',
         t: 'Across India, that smoke was linked to between 44,000 and 98,000 early deaths a year in 2003–2019.',
         src: 'Source: Lan et al. (2022), Nature Communications 13, 6537.', v: mapIndia },
    2: { s: 'Official counts of farm fires in Punjab fell from 71,304 in 2021 to 5,114 in 2025.',
         t: 'Satellite maps of burnt fields show a far smaller fall: 37% between 2022 and 2025 on iFOREST’s maps.',
         src: 'Sources: Ministry of Environment, Forest and Climate Change; Lok Sabha reply; The Tribune; iFOREST (2025).', v: counts },
    3: { s: 'Most large fires now burn after the satellites that count them have passed.',
         t: 'In 2021, 3% of large fires in Punjab burned after 3 pm. In 2024 and 2025, more than 90% did.',
         src: 'Sources: iFOREST (2025), from SEVIRI on Meteosat; Singh et al. (2025), Current Science 129(10).', v: clock },
    4: { s: 'Paying farmers not to burn reduced burning when part of the money came up front.',
         t: 'In a randomised trial with 1,668 farmers in Punjab, an advance raised the share of farmers with no burnt plot by 7.7 to 11.5 percentage points. Paying only after verification had no measurable effect.',
         src: 'Source: Jack, Jayachandran, Kala and Pande (2025), American Economic Review: Insights 7(1), Table 1.', v: trial },
    5: { s: 'The proposal: ₹2,500 an acre for a paddy field left unburnt, ₹500 of it at enrolment.',
         t: 'Every enrolled plot is checked by satellite. Punjab pays for 2027; from 2028 the Centre and Delhi pay for each certified acre, once burning has fallen by at least 5 percentage points.',
         src: 'Source: Abbasov, Bilan, Goncalves, Isgandarli, King, Philip and Zatti (2026), The Clean Field Contract.', v: pay },
    6: { s: 'Punjab can notify the Clean Field Contract in December 2026.',
         t: 'Enrolment in half of Punjab’s villages from June 2027, first final payments in December 2027, and an independent evaluation by March 2028.',
         src: 'Source: Abbasov, Bilan, Goncalves, Isgandarli, King, Philip and Zatti (2026), The Clean Field Contract.', v: route }
  };
  var c = CARDS[n];
  card.querySelector('.statement').textContent = c.s;
  card.querySelector('.support').textContent = c.t;
  card.querySelector('.src').textContent = c.src;
  var svg = d3.select(card.querySelector('.visual')).append('svg').attr('width', W).attr('height', H).attr('viewBox', '0 0 ' + W + ' ' + H);
  var fs = wide ? 22 : 24;
  function t(x, y, s, cls, anchor, size) {
    return svg.append('text').attr('x', x).attr('y', y).attr('class', cls || null).attr('text-anchor', anchor || 'start').style('font-size', (size || fs) + 'px').text(s);
  }
  function mapIndia() {
    var G = window.CFC_GEO, IN = window.CFC_INDIA;
    var states = topojson.feature(G, G.objects.states).features, pb = states.filter(function (f) { return f.properties.name === 'PUNJAB'; })[0];
    var xs = [], ys = [];
    (function walk(c) { if (typeof c[0] === 'number') { xs.push(c[0]); ys.push(c[1]); } else c.forEach(walk); })(IN.outline.geometry.coordinates);
    var pad = 24, x0 = d3.min(xs) * C, x1 = d3.max(xs) * C, y0 = d3.min(ys), y1 = d3.max(ys);
    var k = Math.min((W - 2 * pad) / (x1 - x0), (H - 2 * pad) / (y1 - y0));
    var ox = (W - k * (x1 - x0)) / 2, oy = (H - k * (y1 - y0)) / 2;
    var path = d3.geoPath(d3.geoTransform({ point: function (lon, lat) { this.stream.point(ox + k * (lon * C - x0), oy + k * (y1 - lat)); } }));
    svg.append('path').attr('d', path(IN.outline)).style('fill', 'var(--land)').style('stroke', 'var(--land-line)').style('stroke-width', '1.4px');
    svg.append('path').attr('d', path(IN.states)).style('fill', 'none').style('stroke', '#c3cbcb').style('stroke-width', '0.8px');
    svg.append('path').attr('d', path(pb)).style('fill', 'var(--ember)').style('stroke', '#ffffff').style('stroke-width', '1px');
    var c0 = path.centroid(pb);
    t(c0[0] - 28, c0[1] + 6, 'Punjab', 'ember', 'end', fs + 2);
    var delhi = [ox + k * (77.209 * C - x0), oy + k * (y1 - 28.6139)];
    svg.append('circle').attr('cx', delhi[0]).attr('cy', delhi[1]).attr('r', 5).style('fill', 'var(--ink)');
    t(delhi[0] + 10, delhi[1] + 6, 'Delhi', 'strong', 'start', fs);
  }
  function counts() {
    var d = [[2021, 71304], [2022, 49922], [2023, 36663], [2024, 10909], [2025, 5114]];
    var x = d3.scaleBand().domain(d.map(function (r) { return r[0]; })).range([20, W - 20]).paddingInner(0.28);
    var y = d3.scaleLinear().domain([0, 80000]).range([H - 50, 40]);
    svg.append('line').attr('x1', 20).attr('x2', W - 20).attr('y1', y(0)).attr('y2', y(0)).style('stroke', '#bfc8c9');
    d.forEach(function (r) {
      svg.append('rect').attr('x', x(r[0])).attr('width', x.bandwidth()).attr('y', y(r[1])).attr('height', y(0) - y(r[1])).style('fill', 'var(--ember)');
      t(x(r[0]) + x.bandwidth() / 2, y(r[1]) - 12, d3.format(',')(r[1]), 'strong', 'middle');
      t(x(r[0]) + x.bandwidth() / 2, H - 16, r[0], null, 'middle');
    });
    t(20, 22, 'Official fire counts, 15 September to 30 November', null, 'start', fs - 2);
  }
  function clock() {
    var x = d3.scaleLinear().domain([6, 21]).range([24, W - 24]), axis = H * 0.5, ay = axis - 34;
    svg.append('rect').attr('x', x(15)).attr('width', x(21) - x(15)).attr('y', 70).attr('height', axis - 70).style('fill', 'var(--ember-soft)');
    t(x(21) - 8, 96, 'after 15:00', null, 'end');
    [[10.5, '10:30 pass'], [13.5, '13:30 pass']].forEach(function (p) {
      svg.append('line').attr('x1', x(p[0])).attr('x2', x(p[0])).attr('y1', 52).attr('y2', axis).style('stroke', 'var(--ink-2)').style('stroke-width', '2px').style('stroke-dasharray', '5 5');
      t(x(p[0]), 40, p[1], 'strong', 'middle');
    });
    svg.append('line').attr('x1', x(6)).attr('x2', x(21)).attr('y1', axis).attr('y2', axis).style('stroke', 'var(--ink-3)');
    [6, 9, 12, 15, 18, 21].forEach(function (h) { t(x(h), axis + 34, (h < 10 ? '0' : '') + h + ':00', null, h === 6 ? 'start' : h === 21 ? 'end' : 'middle'); });
    svg.append('path').attr('d', 'M' + (x(13.5) + 12) + ',' + ay + 'L' + (x(17) - 14) + ',' + ay).style('stroke', 'var(--ember)').style('stroke-width', '3px');
    svg.append('path').attr('d', 'M' + (x(17) - 26) + ',' + (ay - 8) + 'L' + (x(17) - 12) + ',' + ay + 'L' + (x(17) - 26) + ',' + (ay + 8)).style('stroke', 'var(--ember)').style('stroke-width', '3px').style('fill', 'none');
    svg.append('circle').attr('cx', x(13.5)).attr('cy', ay).attr('r', 9).style('fill', '#ffffff').style('stroke', 'var(--ember)').style('stroke-width', '3px');
    svg.append('circle').attr('cx', x(17)).attr('cy', ay).attr('r', 9).style('fill', 'var(--ember)');
    t(x(13.5) - 16, ay - 18, 'peak 2020', 'ember', 'end');
    t(x(17) + 16, ay - 18, 'peak 2024', 'ember', 'start');
    var by = axis + 92, bh = 40, bx0 = x(6), bx1 = x(21);
    [['2021', 3], ['2024 and 2025', 90]].forEach(function (r, i) {
      var y = by + i * 96, xa = bx0 + (bx1 - bx0) * (1 - r[1] / 100);
      t(bx0, y - 12, r[0] + ': share of large fires after 15:00', null, 'start', fs - 2);
      svg.append('rect').attr('x', bx0).attr('width', xa - bx0 - 2).attr('y', y).attr('height', bh).style('fill', '#dfe4e3');
      svg.append('rect').attr('x', xa).attr('width', bx1 - xa).attr('y', y).attr('height', bh).style('fill', 'var(--ember)');
      if (r[1] > 50) t(xa + 12, y + bh / 2 + 8, 'more than 90%', 'white', 'start');
      else t(xa - 12, y + bh / 2 + 8, '3%', 'ember', 'end');
    });
  }
  function trial() {
    var rows = [['Part paid up front', 7.7, 3.2, 11.5, 4.2, 'var(--field)'], ['Paid only after verification', 2.0, 3.0, 0.8, 4.2, 'var(--ink-3)']];
    var x = d3.scaleLinear().domain([-10, 22]).range([24, W - 24]);
    var top = 70;
    t(24, 30, 'Effect on the share of farmers with no burnt plot,', null, 'start', fs - 2);
    t(24, 30 + fs + 4, 'percentage points, with 95% intervals', null, 'start', fs - 2);
    [-10, 0, 10, 20].forEach(function (v) {
      svg.append('line').attr('x1', x(v)).attr('x2', x(v)).attr('y1', top + 40).attr('y2', H - 50).style('stroke', v ? '#e3e7e6' : 'var(--ink-3)').style('stroke-width', v ? '1px' : '1.6px');
      t(x(v), H - 18, (v > 0 ? '+' : v < 0 ? '\u2212' : '') + Math.abs(v), null, 'middle');
    });
    rows.forEach(function (r, i) {
      var y0 = top + 90 + i * 170;
      t(24, y0 - 26, r[0], 'strong', 'start');
      [[r[1], r[2]], [r[3], r[4]]].forEach(function (e, j) {
        var y = y0 + j * 44, lo = e[0] - 1.96 * e[1], hi = e[0] + 1.96 * e[1];
        svg.append('line').attr('x1', x(lo)).attr('x2', x(hi)).attr('y1', y).attr('y2', y).style('stroke', r[5]).style('stroke-width', '5px');
        svg.append('circle').attr('cx', x(e[0])).attr('cy', y).attr('r', 10).style('fill', r[5]);
        t(x(hi) + 14, y + 8, (e[0] > 0 ? '+' : '') + e[0].toFixed(1), i ? null : 'strong', 'start');
      });
    });
  }
  function pay() {
    var x = d3.scaleLinear().domain([0, 2500]).range([24, W - 24]), col = { Punjab: 'var(--field)', Centre: 'var(--centre)', Delhi: 'var(--delhi)' };
    [['2027 season', [['Punjab', 500], ['Punjab', 2000]]], ['From 2028', [['Punjab', 500], ['Centre', 1500], ['Delhi', 500]]]].forEach(function (r, i) {
      var y = 90 + i * 210, acc = 0;
      t(24, y - 46, r[0], 'strong', 'start');
      [[0, 500, 'at enrolment'], [500, 2500, 'after a clean season']].forEach(function (b) {
        var a = x(b[0]) + 2, e = x(b[1]) - 4;
        svg.append('path').attr('d', 'M' + a + ',' + (y - 8) + 'V' + (y - 14) + 'H' + e + 'V' + (y - 8)).style('fill', 'none').style('stroke', 'var(--ink-3)');
        t((a + e) / 2, y - 22, b[2], null, 'middle', fs - 4);
      });
      r[1].forEach(function (s) {
        var x0 = x(acc), x1 = x(acc + s[1]) - 3;
        svg.append('rect').attr('x', x0).attr('width', x1 - x0).attr('y', y).attr('height', 64).style('fill', col[s[0]]);
        var lab = t((x0 + x1) / 2, y + 40, s[0] + ' \u20b9' + d3.format(',')(s[1]), 'white', 'middle', fs);
        if (lab.node().getComputedTextLength() > x1 - x0 - 16) { lab.text('\u20b9' + d3.format(',')(s[1])); }
        acc += s[1];
      });
    });
    t(W - 24, H - 20, '\u20b92,500 an acre in total', null, 'end');
  }
  function route() {
    var steps = [['Dec 2026', 'Punjab notifies the contract'], ['Jun 2027', 'Enrolment opens, \u20b9500 an acre'], ['Dec 2027', 'First \u20b92,000 payments'], ['Mar 2028', 'Independent evaluation'], ['Jun 2028', 'Centre and Delhi pay']];
    var y0 = 40, gap = (H - 80) / (steps.length - 1), x0 = 60;
    svg.append('line').attr('x1', x0).attr('x2', x0).attr('y1', y0).attr('y2', y0 + gap * (steps.length - 1)).style('stroke', '#bfc8c9').style('stroke-width', '3px');
    steps.forEach(function (s, i) {
      var y = y0 + i * gap;
      svg.append('circle').attr('cx', x0).attr('cy', y).attr('r', 11).style('fill', i ? '#ffffff' : 'var(--field)').style('stroke', 'var(--field)').style('stroke-width', '3px');
      t(x0 + 32, y - 4, s[0], 'strong', 'start', fs);
      t(x0 + 32, y + fs + 2, s[1], null, 'start', fs);
    });
  }
  c.v();
  document.fonts.ready.then(function () { document.body.setAttribute('data-ready', '1'); });
})();
</script>
</body>
</html>
